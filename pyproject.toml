[project]
name = "pricewatch"
version = "0.1.0"
description = "IT hardware price comparison and market intelligence for Thai retailers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "asyncpg>=0.29",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "selectolax>=1.0",
]

[project.scripts]
pricewatch = "pricewatch.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricewatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"
# Vendored agent skills (.claude/skills/*) keep their upstream style so they
# can be updated by copying; they are not part of the pricewatch package.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "D"]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# pandas-stubs types many return values as Any; the rest of strict mode still applies.
module = ["pricewatch.ml.*"]
warn_return_any = false

[[tool.mypy.overrides]]
# Untyped third-party libraries.
module = ["asyncpg.*", "sklearn.*", "matplotlib.*", "scipy.*"]
ignore_missing_imports = true
