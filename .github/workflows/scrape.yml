name: scrape

on:
  schedule:
    # Every 3 hours (00:17, 03:17, ... UTC = 07:17, 10:17, ... ICT). One JIB
    # run is ~10 requests over ~25 s. Minute 17 avoids GitHub's top-of-hour
    # scheduling backlog.
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev
      - run: uv run pricewatch -v migrate
      - run: uv run pricewatch -v scrape
      # Link even when one store failed: the others' new listings still need it.
      - if: ${{ !cancelled() }}
        run: uv run pricewatch link
      - if: ${{ !cancelled() }}
        run: uv run pricewatch train
