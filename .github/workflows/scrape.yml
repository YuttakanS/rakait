name: scrape

on:
  schedule:
    # Every 3 hours (00:17, 03:17, ... UTC = 07:17, 10:17, ... ICT). One JIB
    # run is ~10 requests over ~25 s; IT City, which needs one request per
    # product page, is the slowest store at ~150 requests over ~7 min. Stores
    # run concurrently. Minute 17 avoids GitHub's top-of-hour scheduling backlog.
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    # IHAVECPU and BaNANA return HTTP 403 to GitHub-hosted (datacenter) IPs,
    # so this job runs on a self-hosted Windows runner on a residential line;
    # install it with scripts/setup-runner.ps1. While that machine is off,
    # runs queue and start when it comes back (GitHub drops them after 24 h).
    runs-on: [self-hosted, Windows, pricewatch]
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev
      - run: uv run pricewatch -v migrate
      - run: uv run pricewatch -v scrape
      # Link even when one store failed: the others' new listings still need it.
      - if: ${{ !cancelled() }}
        run: uv run pricewatch link
      - if: ${{ !cancelled() }}
        run: uv run pricewatch train
